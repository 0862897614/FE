<DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vận dụng transitions</title>
  </head>
  <style>
    button {
        display: flex;
        border: none;
        margin: 30px;
        outline: none;
    }

    .btn    {
        padding: 20px 40px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 99px;
        color: #fff;
        background-color: rgb(227, 58, 227);
        transition: all 0.5s ease-in-out
    }

    /* 1. thay đổi vị trí */
    .btn-1:hover {
        transform: translateY(-50px);
    }

    /* 2. thay đổi BGC */

    .btn-2:hover {
        background-color: rgb(75, 221, 221);
    }

    /* 3. chuyển màu từ trái --> phải */
    .btn-3 {
        position: relative;
        overflow: hidden;
    }

    .btn__span {
        position: relative;
        z-index: 1;
    }

    .btn-3::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0;
        background-color: orange;
        transition: all 0.5s ease-in-out;

    }

    .btn-3:hover::after {
        width: 100%;
    }

    /* chuyển màu từ trái --> phải --> chạy tiếp */

    .btn-4 {
        position: relative;
        overflow: hidden;
    }


    .btn-4::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        /* left: 0; */
        bottom: 0;
        width: 0;
        background-color: orange;
        transition: all 0.5s ease-in-out;

    }

    .btn-4:hover::after {
        width: 100%;
        left: 0;
    }

    /* chuyển màu từ trên --> xuống --> chạy tiếp  */

    .btn-5{
        position: relative;
        overflow: hidden;
    }

    .btn-5::after {
        content:"";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 0;
        background-color: orange;
        transition: all 0.5s ease-in-out;
        
    }

    .btn-5:hover::after {
        height: 100%;
        top: 0;
    }

  </style>
  <body>
    <div class="container">
        <button class="btn btn-1"><span class="btn__span">Hover me!</span></button
        ><button class="btn btn-2"><span class="btn__span">Hover me!</span></button
        ><button class="btn btn-3"><span class="btn__span">Hover me!</span></button
        ><button class="btn btn-4"><span class="btn__span">Hover me!</span></button
        ><button class="btn btn-5"><span class="btn__span">Hover me!</span></button>
    </div>
  </body>
</html>
