<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

   <div class="box"></div>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background: red;
        }
        /* "," lấy khoảng 0 --> 600px và 1000 trở lên */
        @media (min-width: 600px) , (max-width: 1000px) {
            .box {
                background: yellow;
            }
        }
        /* "and" lấy khoảng 700px --> 800px */
         @media (min-width: 700px) and (max-width: 800px) {
            .box {
                background: yellow;
            }
        }
    </style>
</body>
</html>
